[project]
name = "context-engine"
version = "0.1.0"
description = "Context Engine trusted application foundation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.2",
    "argon2-cffi>=23.1.0",
    "cryptography>=42.0.0",
    "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
lightrag-runtime = [
    "numpy>=1.26.0",
    "json-repair>=0.29.0",
    "python-dotenv>=1.0.0",
    "networkx>=3.2.0",
    "nano-vectordb>=0.0.4",
    "tiktoken>=0.7.0",
]
test = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
where = [".", "vendor"]
include = ["context_engine*", "lightrag*"]

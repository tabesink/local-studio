name: Integration Docker

on:
  pull_request:
  workflow_dispatch:

jobs:
  domain-controller-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Confirm Docker daemon
        run: docker info

      - name: Pull runtime controller image
        run: docker pull alpine:3.20

      - name: Run live Docker controller lifecycle gate
        env:
          CE_DOMAIN_RUNTIME_CONTROLLER_KIND: docker
          CE_DOMAIN_CONTROLLER_COMMAND: python scripts/ce-domain-controller.py
          CE_DOMAIN_CONTROLLER_IMAGE: alpine:3.20
        run: python -m pytest -m integration_docker -q --basetemp .pytest-tmp-integration-docker

      - name: Run full test suite
        env:
          CE_DOMAIN_CONTROLLER_IMAGE: alpine:3.20
        run: python -m pytest -m "not integration_docker" -q --basetemp .pytest-tmp-full

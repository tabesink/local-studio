services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB locally}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER locally}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD locally}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - p10-postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      CONTEXT_ENGINE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER locally}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD locally}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB locally}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "uvicorn", "context_engine.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      CONTEXT_ENGINE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER locally}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD locally}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB locally}
      CE_ADMIN_USERNAME: ${CE_ADMIN_USERNAME:?set CE_ADMIN_USERNAME locally}
      CE_ADMIN_PASSWORD: ${CE_ADMIN_PASSWORD:?set CE_ADMIN_PASSWORD locally}
      CE_SESSION_COOKIE_SECURE: ${CE_SESSION_COOKIE_SECURE:-false}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:?set CONFIG_ENCRYPTION_KEY locally}
      CE_DOMAIN_RUNTIME_CONTROLLER_KIND: local
      CE_LIGHTRAG_CLIENT_KIND: local
    ports:
      - "127.0.0.1:${P10_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        CONTEXT_ENGINE_API_BASE: ${CONTEXT_ENGINE_API_BASE:-http://api:8000}
    environment:
      CONTEXT_ENGINE_API_BASE: ${CONTEXT_ENGINE_API_BASE:-http://api:8000}
    ports:
      - "127.0.0.1:${P10_FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      api:
        condition: service_healthy

volumes:
  p10-postgres-data:
